name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily, to notice breakage from new releases of Ruby or dependencies.
  schedule:
    - cron: "17 21 * * *"

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.ruby }}, ${{ matrix.gemfile }})${{ matrix.experimental && ' [experimental]' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        gemfile: [Gemfile]
        include:
          # The oldest rspec-core that omoteura-rspec supports.
          - ruby: "3.4"
            gemfile: gemfiles/rspec_3_12.gemfile
          # An early warning only; a failure here does not fail the build.
          - ruby: head
            gemfile: gemfiles/latest.gemfile
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      # Precompiled native gems often do not declare support for ruby-head yet.
      BUNDLE_FORCE_RUBY_PLATFORM: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake standard
      - run: bundle exec omoteura check --format github
      - run: bundle exec rake package

  nix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix flake check
      - run: nix develop --command ruby -v
