name: CI

# Each job is billed in whole minutes, so checks share a job where they can,
# and workflows run only when what they test changed: the VS Code extension
# and the Nix shell have workflows of their own.
on:
  push:
    branches: [main]
    paths-ignore:
      - "editors/vscode/**"
      - "docs/**"
      - ".github/workflows/vscode.yml"
      - ".github/workflows/nix.yml"
  pull_request:
    paths-ignore:
      - "editors/vscode/**"
      - "docs/**"
      - ".github/workflows/vscode.yml"
      - ".github/workflows/nix.yml"
  # Weekly, to notice breakage from new releases of Ruby or dependencies.
  schedule:
    - cron: "17 21 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.ruby }}, ${{ matrix.gemfile }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0"]
        gemfile: [Gemfile]
        include:
          # The oldest rspec-core that omoteura-rspec supports.
          - ruby: "3.4"
            gemfile: gemfiles/rspec_3_12.gemfile
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      # Lint, dogfooding and packaging need to run once, not per Ruby.
      MAIN: ${{ matrix.ruby == '3.4' && matrix.gemfile == 'Gemfile' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
      - if: env.MAIN == 'true'
        run: bundle exec rake standard
      - if: env.MAIN == 'true'
        run: bundle exec omoteura check --format github
      - if: env.MAIN == 'true'
        run: bundle exec rake package

  # An early warning only, on the weekly run; a failure here does not fail the build.
  ruby-head:
    name: test (head, gemfiles/latest.gemfile) [experimental]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    env:
      BUNDLE_GEMFILE: gemfiles/latest.gemfile
      # Precompiled native gems often do not declare support for ruby-head yet.
      BUNDLE_FORCE_RUBY_PLATFORM: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: head
          bundler-cache: true
      - run: bundle exec rake spec
