name: VS Code

# The integration tests run the omoteura gem from this checkout, so changes
# to the gem's code run them too.
on:
  push:
    branches: [main]
    paths:
      - "editors/vscode/**"
      - "omoteura-core/lib/**"
      - "omoteura-core/exe/**"
      - "spec/fixtures/sample_project/**"
      - ".github/workflows/vscode.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - "omoteura-core/lib/**"
      - "omoteura-core/exe/**"
      - "spec/fixtures/sample_project/**"
      - ".github/workflows/vscode.yml"
  # Weekly, to notice breakage from a new stable VS Code.
  schedule:
    - cron: "37 21 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode:
    name: vscode (${{ matrix.vscode }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest version package.json supports, and the current one.
        vscode: ["1.95.0", stable]
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.4"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - run: npx vsce package --no-dependencies
